name: The Crow's Nest Studio Verified Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(cat VERSION | tr -d '\r\n')" = "$GITHUB_REF_NAME"
      - name: Install FFmpeg for voice and video tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          ffmpeg -hide_banner -version
      - name: Dependencies for checks
        run: python -m pip install 'Pillow>=10.2' 'numpy>=1.26,<3' 'soundfile>=0.12'
      - name: Compile all UI and audio modules
        run: python -m compileall -q gui.py voice_studio_ui.py production_ui.py fact_checker_ui.py narration.py
      - name: Run offline regression tests
        run: python -m unittest discover -v
      - name: Smoke test all desktop windows
        run: |
          xvfb-run -a python - <<'PY'
          from gui import App
          from voice_studio_ui import VoiceStudio
          from production_ui import ProductionStudio
          from fact_checker_ui import FactCheckDialog
          app = App()
          app.update_idletasks()
          assert len(app.tabs.tabs()) == 5
          voice = VoiceStudio(app)
          voice.update_idletasks()
          voice.close()
          queue = ProductionStudio(app)
          queue.update_idletasks()
          assert len(queue.tabs.tabs()) == 3
          queue.destroy()
          review = FactCheckDialog(app, 'ci-smoke', 'Test history',
                                   'Historical lookouts watched for approaching ships.')
          review.update_idletasks()
          review.destroy()
          app.close()
          print('Desktop navigation, Voice Studio, queue, and review windows opened.')
          PY
      - name: Smoke test low-glare and soft-light user settings
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/crows_light"
          mkdir -p "$LOCALAPPDATA/TheCrowsNestStudio"
          printf '{"appearance":"soft_light","ui_scale":1.15}' > "$LOCALAPPDATA/TheCrowsNestStudio/settings.json"
          xvfb-run -a python - <<'PY'
          import gui,production_ui,voice_studio_ui,fact_checker_ui
          assert gui.SOFT_LIGHT and production_ui.SOFT_LIGHT
          assert voice_studio_ui.SOFT_LIGHT and fact_checker_ui.SOFT_LIGHT
          app=gui.App()
          assert len(app.tabs.tabs())==5
          window=production_ui.ProductionStudio(app)
          assert len(window.tabs.tabs())==3
          assert window.want_full.get() and window.want_shorts.get() and window.want_tiktok.get()
          assert window.STYLE_CHOICES['Animated realism (local AI)']=='ai_reenactment'
          window.destroy()
          voice=voice_studio_ui.VoiceStudio(app)
          voice.close()
          fact=fact_checker_ui.FactCheckDialog(
              app,'ci-light-test','Source Test',
              'A medical professional helped the wounded during a naval operation.')
          fact.destroy()
          app.close()
          print('Soft-light theme, font scaling and all creation checkboxes verified.')
          PY
      - name: Verify scrolling on small windows and at larger font sizes
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP/crows_scroll"
          mkdir -p "$LOCALAPPDATA/TheCrowsNestStudio"
          printf '{"appearance":"soft_light","ui_scale":1.4}' > "$LOCALAPPDATA/TheCrowsNestStudio/settings.json"
          xvfb-run -a python - <<'PY'
          from types import SimpleNamespace
          from gui import App
          from production_ui import ProductionStudio
          app=App()
          app.geometry('740x520')
          prod=ProductionStudio(app)
          prod.geometry('710x500')
          prod.update()
          assert len(app._page_scroll_canvases)==5
          assert len(prod._page_scroll_canvases)==3
          for owner in (app,prod):
              for index,canvas in enumerate(owner._page_scroll_canvases):
                  owner.tabs.select(index)
                  owner.update()
                  assert float(canvas.cget('borderwidth'))==0
                  assert canvas.cget('yscrollcommand')
                  first=canvas.yview()[0]
                  # Label inside selected scrollable frame triggers page wheel.
                  outer=owner._page_scroll_containers[index]
                  inside=canvas.nametowidget(canvas.find_all()[0]) if False else None
                  frame=outer.winfo_children()[1] if False else None
                  event=SimpleNamespace(widget=outer,num=5,delta=0)
                  owner._page_mouse_wheel(event)
                  assert canvas.yview()[0]>=first
          # Both the production creation page and all main pages expose scrollbar.
          assert prod._page_scroll_canvases[0].yview()[1]<1.0
          assert app._page_scroll_canvases[1].yview()[1]<1.0
          prod.destroy()
          app.close()
          print('All eight pages have scrollbars and respond to wheel events.')
          PY
      - name: Smoke test research-first Quick AI and source review
        run: |
          xvfb-run -a python - <<'PY'
          import json,tempfile
          from pathlib import Path
          from unittest.mock import patch
          from gui import App
          from fact_checker_ui import FactCheckDialog
          app=App()
          with patch('gui.simpledialog.askstring',return_value='Donald Ballard Medal of Honor'), \
               patch('gui.simpledialog.askinteger',return_value=10), \
               patch('gui.filedialog.askopenfilename',side_effect=AssertionError('Unexpected research notes prompt')), \
               patch('gui.production_engine.create_job',return_value={'id':'aabbccddeeff'}), \
               patch.object(app,'_run_task') as run:
              with patch('gui.production_engine.select_local_model',return_value='qwen3:4b'):
                  app.prompt_draft()
              assert run.call_count==1
          with tempfile.TemporaryDirectory() as directory:
              path=Path(directory)/'sources.json'
              path.write_text(json.dumps({'retrieved_sources':[{
                  'title':'Donald Ballard','publisher':'Wikipedia',
                  'url':'https://en.wikipedia.org/wiki/Donald_E._Ballard',
                  'excerpt':'Search discovery lead; not verified','verified':False
              }]}),encoding='utf-8')
              review=FactCheckDialog(app,'ci-research','Research Check',
                                     'Donald Ballard served as a Navy corpsman in Vietnam.',
                                     source_leads=path)
              review.open_research_sources()
              review.update_idletasks()
              viewers=[w for w in review.winfo_children() if w.winfo_class()=='Toplevel']
              assert len(viewers)==1
              viewers[0].destroy()
              review.destroy()
          app.close()
          print('Quick AI opens no notes picker; discovered sources display in fact checker.')
          PY
      - name: Capture redesigned main window for visual QA
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python - <<'PY'
          import base64,io
          from PIL import ImageGrab
          from gui import App
          app=App()
          app.geometry('1160x830+0+0')
          app.update()
          try:
              shot=ImageGrab.grab(bbox=(0,0,1160,830)).convert('RGB')
              shot.thumbnail((810,580))
              buffer=io.BytesIO()
              shot.save(buffer,format='JPEG',quality=63,optimize=True)
              print('CROWS_UI_SCREENSHOT='+base64.b64encode(buffer.getvalue()).decode())
          except Exception as exc:
              print('Visual inspection unavailable: '+str(exc))
          finally:
              app.close()
          PY
      - name: Build verified code update
        run: python build_release.py
      - name: Build self-contained source installer ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          version=Path('VERSION').read_text().strip()
          name=f'Crows_Nest_Studio_v{version}_Windows.zip'
          allowed={'.py','.ps1','.bat','.md','.txt','.json','.ico','.png','.jpg','.jpeg','.sh'}
          with zipfile.ZipFile(name,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in allowed:continue
                  if any(x in p.parts for x in ('.git','.venv','__pycache__','exports','.updates')):continue
                  if p.name.startswith('test_') or p.parts[0]=='.github':continue
                  z.write(p, f'The_Crows_Nest_Studio_{version}/'+p.as_posix())
              z.write('VERSION',f'The_Crows_Nest_Studio_{version}/VERSION')
          print(name)
          PY
      - name: Publish verified release assets
        # A passing main-branch build creates the release when VERSION changes.
        # A manually pushed tag still works; existing releases are never overwritten.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::The pushed tag does not match VERSION."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. No new release needed."
            exit 0
          fi
          existing_tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR==1 {print $1}')"
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag belongs to another commit. Increment VERSION instead."
            exit 1
          fi
          gh release create "$tag" \
            "Crows_Nest_Studio_Update_${tag}.zip" \
            "Crows_Nest_Studio_v${version}_Windows.zip" \
            --target "$GITHUB_SHA" \
            --title "The Crow's Nest Studio $tag" --generate-notes
